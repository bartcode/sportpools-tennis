name: image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/src/**"
      - "web/public/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/vite.config.ts"
      - "web/tsconfig*.json"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Backend tests
        run: |
          uv sync --frozen
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend tests
        working-directory: web
        run: |
          npm ci
          npx vitest run

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bartcode/sportpools-tennis:latest
            ghcr.io/bartcode/sportpools-tennis:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bartcode/nimblenode
          token: ${{ secrets.NIMBLENODE_TOKEN }}

      - name: Pin the new image tag (ArgoCD rolls it out)
        run: |
          TAG="sha-${GITHUB_SHA}"
          sed -i "s|image: ghcr.io/bartcode/sportpools-tennis:sha-.*|image: ghcr.io/bartcode/sportpools-tennis:${TAG}|" \
            apps/private/sportpools/base/deployment.yaml
          if git diff --quiet; then
            echo "Tag already pinned, nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deploy sportpools image ${TAG}"
          git push
